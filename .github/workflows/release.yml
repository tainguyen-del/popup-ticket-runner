name: Auto Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build portable executable
        run: npm run dist:portable

      - name: Read package version
        id: pkg
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: "Popup Ticket Runner v${{ steps.pkg.outputs.version }}"
          body: |
            ## Popup Ticket Runner v${{ steps.pkg.outputs.version }}
            - Commit: `${{ github.sha }}`
            - **Loại bỏ rò rỉ dữ liệu rác regex & sửa lỗi `exp: không có` (Ticket #1611044):**
              - Tước bỏ khung soạn thảo UI CRM thừa (`Show task` / `Show Jira issues` / `Upload` / `Send note`) khỏi nội dung gửi tới parser và Gemini (`stripCrmComposerChrome` trong [`ticket-parser.js`](src/ticket-parser.js) & [`semantic-ticket.js`](src/semantic-ticket.js)).
              - Chặn rò rỉ chuỗi rác `expiry` / `start` / `scheduleError` của regex sau khi Gemini đã phân tích thành công: khi Gemini trả `endDate: null` hoặc nhận diện các cụm không có hạn (`exp: không có`, `ko có`, `chưa có`, `none`, `N/A`, `TBD`), [`mergeSemanticTicket`](src/semantic-ticket.js) tự động dọn sạch field regex chưa parse và chuyển sang `isIndefinite: true` (`NO_EXPIRY_EVIDENCE_PATTERN`).
              - Mở rộng `dateEvidenceLooksRelevant` (nhận diện cụm tháng/ngày tiếng Việt như `"hết tháng 12"`), `exactEvidenceInTicket` (khớp bỏ dấu & khớp từ), `siteIdIsExplicit`, và bỏ warning giả với ticket 1 ảnh đính kèm.
            - **Nâng cấp kiến trúc AI-first (Gemini đọc ticket và quyết định hành động chính) & Sửa lỗi `Auto turn off poster` (Ticket #1610769):**
              - Đảo ngược quyền quyết định trong [`mergeSemanticTicket`](src/semantic-ticket.js) và [`run.js`](src/run.js): Gemini trực tiếp quyết định `operation`, `startDate`, `expiryDate`, `isIndefinite`, `isMultiPoster`, `hasInlineRemoval`, `keepExistingPopups`, `isReuploadOrResize`, `durationSeconds`, `popupOrderLabels` và `popupPosition` dựa trên bằng chứng trong ticket mà không còn bị chặn hay ghi đè bởi các regex từ khóa cứng (`hasAffirmativePopupReplace`, `hasAffirmativePopupRemoval`, ...).
              - Giữ nguyên các chốt an toàn cấu trúc (không bịa `siteId`, kiểm tra bằng chứng xuất hiện trong ticket, chặn nhầm câu `"hoàn tất design"`, câu phủ định `"do not add..."`, ngày đóng cửa `"tiệm nghỉ..."` và bài Facebook/social) cùng toàn bộ regex fallback khi offline/lỗi mạng.
              - Nâng cấp [`case-knowledge.js`](src/case-knowledge.js) hỗ trợ gộp thêm `knowledge-base.json` trong `%APPDATA%\popup-ticket-runner\` và bổ sung case `Auto turn off poster: 1/01/2027` (tạo mới kèm ngày tắt tự động, không hiểu nhầm thành gỡ/thay thế poster) vào [`data/knowledge-base.json`](data/knowledge-base.json) & fallback [`ticket-parser.js`](src/ticket-parser.js).
            - **Tính năng mới — Tự động & theo yêu cầu xóa popup đã hết hạn:**
              - Tự động phát hiện và xóa các popup đã quá hạn (`time_end < ngày hiện tại` theo múi giờ project) sau khi cập nhật popup trên CMS, luôn bảo toàn popup vô thời hạn, popup còn hạn và ảnh vừa upload; bổ sung checkbox **"Tự động xóa các popup đã hết hạn trên CMS"** trên UI (`--no-cleanup-expired` để tắt).
              - Hỗ trợ ticket chuyên biệt yêu cầu dọn popup hết hạn (`remove-expired`), tách biệt hoàn toàn với `remove-all` để không xóa nhầm popup đang chạy.
              - Sửa [`deletePopupItemAtIndex`](src/cms/popup-editor.js) không bấm `Escape` lên `[role="dialog"]` của chính slideover drawer NewZen CMS, khắc phục triệt để lỗi đóng drawer gây `target-image-match-count-0` ở bước sắp xếp vị trí sau khi xóa card.
            - **Sửa lỗi ticket nhiều vòng hội thoại & nhận diện thay thế sai (Tickets #1609899, ID#9343):**
              - Tách phạm vi phân tích sang comment mới nhất chưa hoàn tất phía trên phản hồi đã xử lý (`"Đã update theo yêu cầu"`, `"Done"`, `"-Done"`), không trộn lệnh gỡ cũ với yêu cầu tạo popup mới.
              - Loại trừ các câu gỡ bài trên Facebook/social (`"gỡ poster đăng trên facebook"`, `"Xoá bài trên FB -Done"`) và cụm `"update lại content"` khỏi hành động gỡ/thay thế popup website.
            - **Hỗ trợ multi-poster, thay ảnh theo kích thước, giữ popup cũ & sắp xếp theo thứ tự (Tickets #1609697, #1607802):**
              - Chờ tải đủ ảnh/comment AJAX trên CRM và gửi kích thước pixel (`width x height`, aspect ratio) cho Gemini Vision chọn đúng ảnh đúng size (ví dụ `1:1` vuông).
              - Nhận diện đúng multi-poster (`"2 coupon pop up"`), giữ popup cũ (`keepsExistingPopups`), áp dụng lịch riêng từng poster, hỗ trợ đối chiếu thay ảnh khác tỷ lệ khung hình (`allowCrossAspectRatioConfirmation`) và tự động sắp xếp lại danh sách theo thứ tự yêu cầu (`Thứ tự: A - B - C`) qua Gemini Vision.
              - Sửa `openPopupSettings` không thoát sớm bởi ảnh trên khung preview khi accordion `Popup_setting` còn đóng, đồng thời bổ sung `readLegacyFlatPopupItems` đọc popup form phẳng bản `1.0.31`.
            - **Sửa lỗi timeout 30s ở bộ chọn ngày `v-calendar` trong Popup settings (Ticket #1609262):**
              - Đọc tiêu đề tháng/năm (`calendarHeading`) nguyên tử qua `evaluate()` trên DOM đang hiển thị, bổ sung timeout ngắn và cơ chế retry thay vì treo 30s trên `.vc-title.nth(1)` khi Vue vừa unmount node transition.
              - Bổ sung chờ popover lịch (`popupCalendar`), chuẩn hóa `calendarMonthStart`, retry khi click ngày/nút chuyển tháng và blur input sau `Clear` (`clearPopupDateControl`).
            - **Sửa lỗi mở 2 tab (1 tab trống + 1 tab chạy ticket) thành chỉ mở 1 tab duy nhất:**
              - Giữ cờ mặc định `--no-startup-window` ở nhánh non-persistent và bỏ `--new-window` dư thừa trong `launchToolBrowser` (`src/browser-session.js`), tránh Chrome tự mở thêm tab trống `chrome://newtab/`.
              - Bổ sung `acquireSinglePage(context)` trong `src/run.js` để đóng mọi tab dư thừa khi khởi chạy ticket, chỉ giữ đúng 1 tab hoạt động (vẫn giữ nguyên luồng đăng nhập 2 tab).
            - **Sửa triệt để lỗi `popup-section-not-found` & nhận diện đúng ticket chỉnh thời gian vs tạo popup mới (Ticket #1608801):**
              - Loại trừ số địa chỉ hướng Nam (`15 S Main St`), thập niên (`80s`, `90s`) và chỉ số slider website (`slider 1`, `slider 2`) khỏi bộ lọc nhận diện thời lượng `extractPopupDuration` để tránh phân loại nhầm ticket tạo popup thành `update-duration`.
              - Mở rộng `hasAffirmativePosterUpload` và `mergeSemanticTicket` cho các cách diễn đạt tạo/up popup mới; khi ticket có ảnh đính kèm mới và có yêu cầu thời gian hiển thị, tool tự động chạy luồng upload poster kèm cài đặt `Time delay slider` thay vì chặn bởi luồng duration-only.
              - Sửa `openPageEditor`, `popupSectionCards` (`isAnnouncementSectionText`) và `existingPopupSection` chờ Vue render danh sách `div[id^="item_block_section#"]` sau khi mở `index.yml` (tối đa 4s) và khớp linh hoạt nhãn `Announcement Popup` / `ANNOUNCEMENT 1038`.
            - **Gỡ popup thông minh theo chủ đề & Tự động nâng cấp plugin lên 1.0.38 khi gỡ popup:**
              - Hỗ trợ ticket yêu cầu gỡ popup chỉ bằng ngữ cảnh văn bản (không cần ảnh đính kèm, VD: *"xóa giúp poster thông báo nghỉ lễ trên website"*): Gemini tự nhận diện hành động (`remove-one` / `remove-all`), chủ đề cần gỡ (`removalTopic`) và trả về kế hoạch thực hiện (`actionSummary`).
              - Hỗ trợ nhận diện và gỡ **cùng lúc nhiều popup** khớp yêu cầu từ Gemini Vision (VD: tiệm có 2 poster thông báo nghỉ lễ giống hoặc cùng chủ đề).
              - **Tự động nâng cấp plugin & dọn dẹp section cũ khi gỡ popup:** Khi website còn dùng Announcement bản cũ (`1.0.34`, outdated) hoặc còn thẻ rác `N/A N/A`, tool tự động quét timezone, snapshot toàn bộ popup hiện có, loại bỏ các popup cần gỡ, nâng cấp Announcement plugin lên bản mới nhất (`1.0.38`), xóa sạch section cũ và thẻ `N/A`, tạo mới section `ANNOUNCEMENT 1038 (*)`, đưa các popup còn hạn được giữ lại sang section mới rồi tiến hành Build web.
              - Tối ưu xóa trực tiếp trên bản `1.0.38`: sắp xếp xóa theo thứ tự từ dưới lên (descending index) để tránh lệch vị trí, khớp trực tiếp theo URL ảnh trong DOM, chỉ đọc snapshot Vue mới nhất (`readPopupListItems`) và giữ drawer mở xuyên suốt để tránh giật/lỗi DOM.
            - **Nâng cấp đọc hiểu ngữ nghĩa Gemini & Ưu tiên comment cập nhật mới nhất:**
              - Tăng cường cơ chế chờ AJAX comment CRM ổn định (`readFullTicketContext`), không bỏ sót comment hoặc ảnh gửi bổ sung sau cùng.
              - Khi có comment bổ sung kiểu *"Nhờ team thay bằng poster này giúp"* / *"lấy poster này"*, Gemini và Vision tự động ưu tiên poster mới trong comment thay thế poster cũ ở note ban đầu.
              - Phân biệt chính xác **ngày nghỉ lễ của tiệm** vs **ngày bắt đầu hẹn giờ đăng popup (`startDate`)**: không gán nhầm `startDate` khi note chỉ ghi lịch nghỉ (VD: *"tiệm nghỉ từ 24/11 đến 26/11"*), đồng thời vẫn trích xuất chuẩn `expiryDate`.
              - Cho phép migrate các popup bảo lưu sang section mới ngay cả khi ticket không upload ảnh mới (`normalizeTicketPopupEntries`).
            - **Ổn định giao diện NewZen CMS Page Editor & Popup Drawer:**
              - Sửa lỗi selector CSS chứa ký tự `#` (`item_block_section#4`) bằng `div[id="..."]`, loại bỏ thẻ lỗi `N/A N/A` khi tìm Announcement section hợp lệ và dọn thẻ `N/A` trước khi chốt `sectionId` sau nâng cấp plugin.
              - Sửa lỗi `openPopupSection` khi gặp thẻ `N/A N/A` bị hỏng sau nâng cấp (dùng fallback timeout ngắn và chuyển qua thay thế section thay vì văng lỗi sớm).
              - Sửa lỗi `returnToPageEditor` bị đánh lừa bởi breadcrumb `Content blocks` và giới hạn phạm vi nút `Back` trong drawer.
              - Loại bỏ thao tác spam click gây đóng/mở drawer liên tục trong `openPopupSection`, nhận diện trạng thái drawer mở trực tiếp từ DOM bất kể vị trí cuộn.
            - **Sửa triệt để nhận diện trùng poster & đồng bộ vị trí khi thay thế popup (Ticket #1607558):**
              - Nâng cấp thuật toán so sánh ảnh `findDuplicatePopupImagesWithVision` lên lưới `64×64` kết hợp **Pearson correlation**, tỷ lệ pixel thay đổi và đối chiếu Gemini Vision cho ngưỡng cận biên — loại bỏ hoàn toàn nhận diện nhầm 2 poster khác nội dung nhưng dùng chung nền/logo tiệm (ví dụ *Monday Special* vs *Thanksgiving*).
              - Sửa lỗi `target-image-match-count-0` khi thay thế popup: chờ URL ảnh upload ổn định qua preview `blob:`, chặn xác nhận URL ảnh cũ trước khi Vue cập nhật xong ảnh mới (`verifyPersistedPopupItem`), và tự động chờ Vue đồng bộ danh sách trước khi sắp xếp thứ tự popup.
            - **Khắc phục triệt để lỗi chọn sai múi giờ (New York UTC-05:00):**
              - Tự động nhận diện chính xác múi giờ từ `setting.json`, `footer.json` trong CMS `/files` hoặc từ HTML website live / preview.
              - Hỗ trợ toàn diện các định dạng dấu câu trong địa chỉ: `CA 95605`, `CA, 95605`, `CA - 95605`, `California, 95605`.
              - Tích hợp bảng tra cứu dải ZIP Code Hoa Kỳ 5 chữ số và Canada Postal Code: đầu số `95605` tự động phân giải thành **California (CA) -> Los Angeles (UTC-08:00)** kể cả khi không có chữ CA đứng trước.
              - Quét đệ quy các trường JSON có cấu trúc (`city`, `state`, `zip`, `postal_code`) và trích xuất trọn vẹn từ Ace Editor NewZen, không bị cắt dòng do ảo hóa giao diện.
              - Bổ sung cơ chế dự phòng đa tầng (Multi-tier fallback): CMS Files -> Live Website HTML/Schema -> Ticket Notes -> Default Timezone.
            - **Tự động đưa popup mới của ticket lên vị trí đầu tiên (Card 1):**
              - Mặc định mọi popup mới từ ticket đều được đưa lên vị trí đầu tiên (Card 1 / Top Priority) trong Popup settings.
              - Khi nâng cấp plugin / chuyển block (migration), tất cả các popup cũ còn hạn được giữ lại sẽ xếp nối tiếp phía sau (Card 2, 3, 4...) và bảo lưu 100% thứ tự tương đối ban đầu.
              - Bảo toàn vị trí khi thay thế (replace) ảnh cũ tại đúng slot của ảnh đó.
            - **Tự động đọc ảnh poster bằng Gemini Vision để tìm ngày hết hạn (Promotion Period / Expiration Date):**
              - Gemini Vision luôn tự động quét ảnh poster để đọc ngày khuyến mãi / ngày kết thúc (kể cả định dạng độc lập không kèm năm như `Dec 31`, `November 22 – December 31`).
              - Chuẩn hóa thứ tự ưu tiên (Precedence): Nếu note ticket có ghi ngày -> ưu tiên dùng ngày note ticket; Nếu note ticket không ghi ngày -> tự động kế thừa ngày từ ảnh poster popup.
              - **Tự động phát hiện & phục hồi ảnh lỗi/thiếu byte (Truncated PNG/JPEG):** Phát hiện các ảnh chat/comment trên CRM bị cắt cụt chunk cuối (`Unable to process input image`) và tự động tái mã hóa qua trình duyệt trước khi gửi Gemini Vision hoặc upload CMS, đồng thời nén gọn payload khi ticket có nhiều ảnh.
            - **Tối ưu hóa và ổn định kết nối Gemini Vision & Giao diện UI:**
              - Chuyển sang model mặc định `gemini-flash-lite-latest` siêu nhanh với hạn mức lớn.
              - Chuẩn hóa danh sách model dự phòng hợp lệ (`gemini-flash-lite-latest`, `gemini-3.5-flash-lite`, `gemini-3.1-flash-lite`, `gemini-3.8-flash`, `gemini-3.5-flash`) và log rõ nguyên nhân thật sự khi API gặp sự cố thay vì báo nhầm lỗi mạng.
              - Hiển thị trực quan **Kế hoạch thực hiện (`actionSummary`)**, **Timezone đã cập nhật** và **Lý do gỡ popup** trên giao diện kết quả UI.
              - Tích hợp sẵn API key nội bộ hoạt động out-of-the-box cho mọi máy, không bắt buộc người dùng phải tự cấu hình key cá nhân.
            - **Tải file executable:** Tải file **`Popup Ticket Runner Final.exe`** ở mục Assets bên dưới để sử dụng trực tiếp không cần cài đặt.
          files: dist/Popup Ticket Runner Final.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

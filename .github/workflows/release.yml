name: Auto Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build portable executable
        run: npm run dist:portable

      - name: Read package version
        id: pkg
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: "Popup Ticket Runner v${{ steps.pkg.outputs.version }}"
          body: |
            ## Popup Ticket Runner v${{ steps.pkg.outputs.version }}
            - Commit: `${{ github.sha }}`
            - **Tối ưu hóa tốc độ chạy ticket:**
              - Cắt giảm các khoảng chờ tĩnh không cần thiết (`waitForTimeout`), chuyển sang chờ có điều kiện DOM (`waitFor`, `waitForURL`).
              - Giảm debounce search CMS từ 1500ms xuống 400ms.
              - Tối ưu hóa chụp ảnh màn hình báo cáo trung gian (chuyển sang chụp viewport `fullPage: false`), giảm 8 - 10 giây cho mỗi lượt chạy ticket.
            - **Khắc phục triệt để lỗi khi ẩn tab / minimize cửa sổ CRM khi tool đang chạy:**
              - Bổ sung các cờ chống background throttling cho Chromium (`--disable-background-timer-throttling`, `--disable-backgrounding-occluded-windows`, `--disable-renderer-backgrounding`).
              - Chuyển cơ chế `waitForFunction` sang polling timer cố định 150ms thay vì `requestAnimationFrame` (vốn bị Windows freeze khi cửa sổ bị ẩn/minimize).
              - Tự động tìm và kích hoạt lại tab Ticket mục tiêu trong CRM nếu người dùng chuyển tab.
            - Bổ sung tính năng xác minh trạng thái CMS cuối cùng sau khi Build: kiểm tra `status_build = COMPLETE`, trạng thái dự án, và live website HTTP 200 OK.
            - Sửa lỗi nhận diện nhầm thông báo "Saved successfully" (khi lưu nháp ở 1%) thành build hoàn tất, đảm bảo tool luôn chờ đến khi CMS build xong 100%.
            - Nhận diện ngữ nghĩa lịch vô thời hạn ("Đến khi khách tắt" / "Không set hạn") và clear sạch 2 ô ngày `Time start` / `Time end`.
            - Chuẩn hóa nhận diện ngày tháng tiếng Anh và tránh nhầm lẫn từ khóa `FROM` trong tên tiệm.
            - Tự động đăng nhập CMS (CMS Auto-Login).
            - Tải file **`Popup Ticket Runner Final.exe`** ở mục Assets bên dưới để sử dụng trực tiếp không cần cài đặt.
          files: dist/Popup Ticket Runner Final.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete older releases (Keep only latest)
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 1
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

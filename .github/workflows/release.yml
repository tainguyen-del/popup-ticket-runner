name: Auto Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build portable executable
        run: npm run dist:portable

      - name: Read package version
        id: pkg
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: "Popup Ticket Runner v${{ steps.pkg.outputs.version }}"
          body: |
            ## Popup Ticket Runner v${{ steps.pkg.outputs.version }}
            - Commit: `${{ github.sha }}`
            - Bổ sung tính năng tự động đăng nhập CMS (CMS Auto-Login).
            - Sửa lỗi tìm kiếm nút Add block và hỗ trợ mục Popup_setting trên Announcement v1.0.38 (Ticket 1597101).
            - Xử lý gỡ bỏ / thay thế 1-1 chính xác cho popup cũ khi ticket yêu cầu replace, không đem popup cũ sang block mới (Ticket 1597101).
            - Tự động xóa sạch các section cũ và section mồ côi (N/A N/A) khi nâng cấp version Announcement plugin.
            - Bổ sung tính năng gắn link ảnh popup (`Image link`) từ ghi chú trong ticket (Ticket 1575574).
            - Xử lý workflow đa poster: tải các poster mới lên trước, sau đó mới gỡ poster cũ để tránh CMS nhân bản ảnh cũ (Ticket 1595897).
            - Nhận diện linh hoạt dải ngày khuyến mãi in trên banner poster (như `NOV 16 – DEC 7`, `NOV 15 – DEC 31, 2026`) (Ticket 1595897).
            - Bảo toàn đầy đủ cả ngày bắt đầu (`time_start`) và ngày kết thúc (`time_end`) của các popup cũ còn hiệu lực khi migrate sang block Announcement mới (Ticket 1596219).
            - Nhận diện chính xác block trống khi CMS tự động điền `time_start`.
            - Tải file **`Popup Ticket Runner Final.exe`** ở mục Assets bên dưới để sử dụng trực tiếp không cần cài đặt.
          files: dist/Popup Ticket Runner Final.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete older releases (Keep only latest)
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 1
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Auto Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build portable executable
        run: npm run dist:portable

      - name: Read package version
        id: pkg
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: "Popup Ticket Runner v${{ steps.pkg.outputs.version }}"
          body: |
            ## Popup Ticket Runner v${{ steps.pkg.outputs.version }}
            - Commit: `${{ github.sha }}`
            - **Tự động đưa popup mới của ticket lên vị trí đầu tiên (Card 1):**
              - Mặc định mọi popup mới từ ticket đều được đưa lên vị trí đầu tiên (Card 1 / Top Priority) trong Popup settings.
              - Khi nâng cấp plugin / chuyển block (migration), tất cả các popup cũ còn hạn được giữ lại sẽ xếp nối tiếp phía sau (Card 2, 3, 4...) và bảo lưu 100% thứ tự tương đối ban đầu.
              - Bảo toàn vị trí khi thay thế (replace) ảnh cũ tại đúng slot của ảnh đó.
            - **Tự động đọc ảnh poster bằng Gemini Vision để tìm ngày hết hạn (Promotion Period / Expiration Date):**
              - Gemini Vision luôn tự động quét ảnh poster để đọc ngày khuyến mãi / ngày kết thúc (kể cả định dạng độc lập không kèm năm như `Dec 31`, `November 22 – December 31`).
              - Chuẩn hóa thứ tự ưu tiên (Precedence): Nếu note ticket có ghi ngày -> ưu tiên dùng ngày note ticket; Nếu note ticket không ghi ngày -> tự động kế thừa ngày từ ảnh poster popup.
            - **Tối ưu hóa và ổn định kết nối Gemini Vision:**
              - Chuyển sang model mặc định `gemini-flash-lite-latest` siêu nhanh (1.8s text, 4.5s vision) với hạn mức lớn, không bị chạm ngưỡng 20 lượt/ngày.
              - Tự động xoay vòng model dự phòng (Auto-fallback) giữa `gemini-flash-lite-latest`, `gemini-3.1-flash-lite`, `gemini-3.5-flash` khi Google gặp lỗi quá tải (503) hoặc chạm hạn mức (429).
              - Tích hợp sẵn API key nội bộ hoạt động out-of-the-box cho mọi máy, không bắt buộc người dùng phải tự cấu hình key cá nhân.
            - **Sửa lỗi Time delay slider:**
              - Đảm bảo điền chính xác giá trị thời gian chờ slider (mặc định 5s hoặc theo ticket yêu cầu).
            - **Cải tiến độ trễ tải ảnh CRM:**
              - Tăng thời gian chờ CRM render upload card để không bị rớt ảnh đính kèm khi mạng chậm.
              - Tự động quét Vision ngay trên file ảnh đã tải về máy qua cơ chế fallback.
            - **Tải file executable:** Tải file **`Popup Ticket Runner Final.exe`** ở mục Assets bên dưới để sử dụng trực tiếp không cần cài đặt.
          files: dist/Popup Ticket Runner Final.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

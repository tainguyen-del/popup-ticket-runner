name: Auto Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build portable executable
        run: npm run dist:portable

      - name: Read package version
        id: pkg
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: "Popup Ticket Runner v${{ steps.pkg.outputs.version }}"
          body: |
            ## Popup Ticket Runner v${{ steps.pkg.outputs.version }}
            - Commit: `${{ github.sha }}`
            - Cập nhật phân biệt 1 poster vs nhiều poster (Ticket 1594040).
            - Nhận diện tự động hành động thay thế (Replace: update lại, đổi, thay) cho Ticket 1594214.
            - Bổ sung cơ chế check trùng ảnh thông minh bằng thị giác điểm ảnh (Visual Similarity >= 90%).
            - Tải file **`Popup Ticket Runner Final.exe`** ở mục Assets bên dưới để sử dụng trực tiếp không cần cài đặt.
          files: dist/Popup Ticket Runner Final.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete older releases (Keep only latest)
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 1
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
